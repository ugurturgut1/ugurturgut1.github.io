<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ page.title }} · Ugur Turgut</title>
<link rel="icon" href="{{ '/avatar.jpg' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
</head>
<body>
<nav><div class="wrap">
  <a class="home" href="{{ '/' | relative_url }}"><span>~/</span>ugur</a>
  <a href="{{ '/#writeups' | relative_url }}">All writeups</a>
</div></nav>
<main class="wrap">
  <article class="post">
    <div class="label">~/writeups/{{ page.slug }}</div>
    <h1>{{ page.title }}</h1>
    <div class="meta">{{ page.date | date: "%d %b %Y" }}{% if page.event %} · {{ page.event }}{% endif %}{% if page.category %} · {{ page.category }}{% endif %}</div>
    <div class="prose">{{ content }}</div>
  </article>
</main>
<footer><div class="wrap">© {{ 'now' | date: "%Y" }} Ugur Turgut · <a href="{{ '/' | relative_url }}">back home</a></div></footer>
</body>
</html>
